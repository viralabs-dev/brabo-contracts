name: publish

run-name: ${{ format('publish {0} ← tag do carimbo', github.ref_name) }}

# Publica os dois pacotes no GitHub Packages quando a tag vX.Y.Z[-dev.N] nasce (ADR 0270).
# A tag é empurrada pelo token do App (tag.yml), por isso dispara este workflow; o GITHUB_TOKEN não dispararia.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  publicar:
    uses: viralabs-dev/brabo-ci/.github/workflows/publish-npm.yml@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
    with:
      pacotes: |
        packages/shared
        packages/docker-port
      tag: ${{ github.ref_name }}
      ci_ref: 6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
  # Vínculos (AT-773): sem `needs`, só lê a origem da linha `Carimbo:` da tag anotada.
  vinculos:
    name: Vínculos (origem pela tag)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Vínculos do run
        uses: viralabs-dev/brabo-ci/.github/actions/vinculos@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17 (AT-773)
