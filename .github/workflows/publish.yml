name: publish

# Publica os dois pacotes no GitHub Packages quando a tag vX.Y.Z[-dev.N] nasce (ADR 0270).
# A tag é empurrada pelo token do App (tag.yml), por isso dispara este workflow; o GITHUB_TOKEN não dispararia.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  publicar:
    uses: viralabs-dev/brabo-ci/.github/workflows/publish-npm.yml@8cd085b29089bc630ce85cb851e0ab6eef0e56c4  # brabo-ci dev, merge da ci#13 (publish-npm.yml)
    with:
      pacotes: |
        packages/shared
        packages/docker-port
      tag: ${{ github.ref_name }}
      ci_ref: 8cd085b29089bc630ce85cb851e0ab6eef0e56c4
