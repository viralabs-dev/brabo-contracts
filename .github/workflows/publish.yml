name: publish

# Publica os dois pacotes no GitHub Packages quando a tag vX.Y.Z[-dev.N] nasce (ADR 0270).
# A tag é empurrada pelo token do App (tag.yml), por isso dispara este workflow; o GITHUB_TOKEN não dispararia.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  publicar:
    uses: viralabs-dev/brabo-ci/.github/workflows/publish-npm.yml@13f3697aaf3e4a151637755babb58422a44db303  # brabo-ci dev, merge da ci#17
    with:
      pacotes: |
        packages/shared
        packages/docker-port
      tag: ${{ github.ref_name }}
      ci_ref: 13f3697aaf3e4a151637755babb58422a44db303
