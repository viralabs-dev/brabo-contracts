name: publish

# Publica os dois pacotes no GitHub Packages quando a tag vX.Y.Z[-dev.N] nasce (ADR 0270).
# A tag é empurrada pelo token do App (tag.yml), por isso dispara este workflow; o GITHUB_TOKEN não dispararia.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  publicar:
    uses: viralabs-dev/brabo-ci/.github/workflows/publish-npm.yml@f2d99e4f92273318a6a57536b94de205a48ac5cb  # brabo-ci dev, merge da ci#16
    with:
      pacotes: |
        packages/shared
        packages/docker-port
      tag: ${{ github.ref_name }}
      ci_ref: f2d99e4f92273318a6a57536b94de205a48ac5cb
